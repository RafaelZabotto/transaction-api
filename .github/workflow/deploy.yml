name: Deploy Transaction API

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar permissão de execução ao gradlew
        run: chmod +x ./gradlew

      - name: Rodar testes
        run: ./gradlew clean test


  build-and-deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Dar permissão de execução ao gradlew
        run: chmod +x ./gradlew

      - name: Build do projeto
        run: ./gradlew clean build

      - name: Login no Registry da Magalu Cloud
        run: echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ secrets.REGISTRY_SERVER }} -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build da imagem Docker
        run: docker build -t ${{ secrets.REGISTRY_SERVER }}/registry-transaction-api/transaction-api:${{ github.sha }} .

      - name: Push da imagem para o registry
        run: docker push ${{ secrets.REGISTRY_SERVER }}/registry-transaction-api/transaction-api:${{ github.sha }}

      - name: Configurar o kubectl
        run: |
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > kubeconfig.yaml
          echo "KUBECONFIG=$PWD/kubeconfig.yaml" >> $GITHUB_ENV

      - name: Substituir placeholder da imagem no manifesto
        run: |
          sed -i "s|DOCKER_IMAGE_PLACEHOLDER|${{ secrets.REGISTRY_SERVER }}/registry-transaction-api/transaction-api:${{ github.sha }}|g" k3s/app-purchase-transaction.yml

      - name: Aplicar manifesto no Kubernetes
        run: |
          kubectl --kubeconfig $HOME/.kube/config apply -f k3s/app-purchase-transaction.yml

      - name: Deploy no K3s
        run: |
          kubectl set image deployment/transaction-api \
            transaction-api=${{ secrets.REGISTRY_SERVER }}/registry-transaction-api/transaction-api:${{ github.sha }}
          kubectl rollout status deployment/transaction-api
